<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geburtstag</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: black;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: hotpink;
      font-size: 4rem;
      text-align: center;
      text-shadow: 0 0 20px hotpink;
      animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px hotpink;
      }
      to {
        text-shadow: 0 0 30px deeppink;
      }
    }
  </style>
</head>
<body>
  <h1>Alles Gute zu Geburtstag du fett sacht 🎉</h1>
</body>
</html>
